<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自定义事件倒计时</title>

  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      text-align: center;
      padding-top: 50px;
      background: #f5f5f5;
      color: #333;
      
      /* 【新增】设置固定背景图 URL (替换为你想要的图片链接) */
      background-image: url('https://assets.699pic.com/public/web/images/601/591/693.jpg!detail.v1');
  
      /* 【新增】背景适配属性 */
      background-size: cover;       /* 铺满屏幕 */
      background-position: center;  /* 居中 */
      background-repeat: no-repeat; /* 不平铺 */
      min-height: 100vh;            /* 最小高度占满视口 */
    }

    h2 {
      margin-bottom: 24px;
      word-break: break-all;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2); 
  
      /* 【修改点】把原来的 24px (或其他值) 改大 */
      font-size: 36px;   
  
      /* 【可选】如果想更醒目，可以加粗或调整字间距 */
      font-weight: bold;
      letter-spacing: 6px;
    }

    .panel {
      max-width: 760px;

      /* 面板整体下移，露出更多背景 */
      margin: 60px auto 30px;

      /* 内部上方留白更大，视觉更通透 */
      padding: 40px 24px 24px;

      /* 面板原有磨砂玻璃背景 */
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      font-size: 16px;
      font-weight: bold;
    }

    input[type="datetime-local"],
    input[type="text"] {
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.2s;
    }

    input[type="datetime-local"]:focus,
    input[type="text"]:focus {
      border-color: #2563eb;
    }

    input:disabled {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .name-input {
      width: 280px;
    }

    /* =========================================
      按钮：与倒计时 .item 完全同款磨砂玻璃
      包括鼠标悬浮效果也一致
    ========================================= */

    button {
      appearance: none;
      -webkit-appearance: none;

      position: relative;
      overflow: hidden;
      isolation: isolate;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      /* 与倒计时 .item 同款尺寸和圆角 */
      padding: 10px 16px;
      min-width: auto;
      border-radius: 10px;

      font-family: inherit;
      font-size: 15px;
      line-height: 1;
      color: #fff;

      /* 原主按钮颜色 #2563eb，同色半透明用于磨砂 */
      background: rgba(37, 99, 235);

      border: 1px solid rgba(255, 255, 255, 0.22);

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);

      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      opacity: 1;

      transition:
        transform 0.2s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        opacity 0.2s ease;
    }

    /* 玻璃表面高光，与倒计时 .item 一致 */
    button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.08) 35%,
        rgba(255, 255, 255, 0) 60%
      );
    }

    /* 鼠标悬浮：与 .item:hover 一致，上浮并轻微变实 */
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(37, 99, 235);
      opacity: 1;
    }

    /* 按下：与 .item:active 一致，轻微缩放 */
    button:active:not(:disabled) {
      transform: scale(0.98);
      background: rgba(37, 99, 235);
      opacity: 1;
    }

    /* 键盘聚焦提示，不影响玻璃效果 */
    button:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.45);
      outline-offset: 2px;
    }

    /*=========================================
      secondary 按钮
      原颜色 #64748b，同色半透明磨砂
    ========================================= */

    button.secondary {
      background: rgba(100, 116, 139);
    }

    button.secondary:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(100, 116, 139);
      opacity: 1;
    }

    button.secondary:active:not(:disabled) {
      transform: scale(0.98);
      background: rgba(100, 116, 139);
      opacity: 1;
    }

    /* =========================================
      禁用按钮
      原颜色 #94a3b8，同色半透明磨砂
    ========================================= */

    button:disabled {
      background: rgba(148, 163, 184);
      color: rgba(255, 255, 255, 0.82);

      cursor: not-allowed;
      transform: none;
      opacity: 0.78;
    }

    /*button:disabled:hover,
    button:disabled:active {
      transform: none;
      background: rgba(148, 163, 184);
      opacity: 0.78;
    }*/

    .status {
      margin-top: 10px;
      font-size: 15px;
      color: #666;
      min-height: 24px;
      word-break: break-all;
    }

    .countdown {
      margin-top: 40px;
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    /* =========================================
      兼容不支持 backdrop-filter 的浏览器
    ========================================= */

    @supports not (
      (backdrop-filter: blur(14px)) or
      (-webkit-backdrop-filter: blur(14px))
    ) {
      button {
        background: rgba(37, 99, 235, 0.86);
      }

      button:hover:not(:disabled),
      button:active:not(:disabled) {
        background: rgba(37, 99, 235, 0.92);
      }

      button.secondary {
        background: rgba(100, 116, 139, 0.86);
      }

      button.secondary:hover:not(:disabled),
      button.secondary:active:not(:disabled) {
        background: rgba(100, 116, 139, 0.92);
      }

      button:disabled {
        background: rgba(148, 163, 184, 0.72);
      }

      button:disabled:hover,
      button:disabled:active {
        background: rgba(148, 163, 184, 0.72);
      }
    }

    /* 倒计时数字块：磨砂玻璃效果 */
    .item {
      position: relative;
      overflow: hidden;

      color: #fff;
      padding: 18px 22px;
      border-radius: 14px;
      min-width: 90px;

      background: rgba(51, 65, 85, 0.55); /* 默认深灰玻璃 */
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
      0 8px 24px rgba(0, 0, 0, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);

      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.2s ease;
    }

    /* 顶部轻微高光，更像玻璃 */
    .item::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.08) 35%,
        rgba(255, 255, 255, 0) 60%
      );
    }

    /* 未开始：默认深灰玻璃 */
    .countdown.state-idle .item {
      background: rgba(51, 65, 85, 0.58);
      border-color: rgba(255, 255, 255, 0.20);
    }

    /* 未结束 / 进行中：绿色玻璃 */
    .countdown.state-running .item {
      background: rgba(22, 163, 74, 0.58);
      border-color: rgba(134, 239, 172, 0.35);
      box-shadow:
        0 8px 24px rgba(22, 163, 74, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    /* 已结束：红色玻璃 */
    .countdown.state-ended .item {
      background: rgba(220, 38, 38, 0.58);
      border-color: rgba(252, 165, 165, 0.35);
      box-shadow:
        0 8px 24px rgba(220, 38, 38, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    /* 鼠标悬浮效果，可选 */
    .item:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.16);
    }

    .countdown.state-running .item:hover {
      background: rgba(22, 163, 74, 0.68);
    }

    .countdown.state-ended .item:hover {
      background: rgba(220, 38, 38, 0.68);
    }

    .countdown.state-idle .item:hover {
      background: rgba(51, 65, 85, 0.68);
    }

    /* 点击效果，可选 */
    .item:active {
      transform: scale(0.98);
    }

    .num {
      font-size: 40px;
      font-weight: bold;
      line-height: 1;
    }

    .label {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.85;
    }
    /* ===========================
   移动端适配
   =========================== */
    *,
    *::before,
    *::after {
    box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: 24px;
    }

    @media screen and (max-width: 768px) {
  body {
    padding: 20px 12px 40px;
  }

  h2 {
    font-size: clamp(24px, 7vw, 36px);
    margin-bottom: 16px;
    line-height: 1.25;
  }

  .panel {
    width: 100%;
    max-width: 100%;
    margin: 16px auto 20px;
    padding: 16px;
    border-radius: 14px;
  }

  .row {
    gap: 10px;
    margin-bottom: 14px;
  }

  .row label {
    flex: 0 0 100%;
    text-align: left;
    font-size: 14px;
  }

  input[type="text"],
  input[type="datetime-local"] {
    width: 100%;
    min-width: 0;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
  }

  .name-input {
    width: 100%;
  }

  button {
    flex: 1 1 auto;
    min-height: 44px;
    padding: 12px 14px;
    font-size: 14px;
    border-radius: 10px;
  }

  .status {
    font-size: 14px;
    min-height: 22px;
  }

  .countdown {
    gap: 10px;
    margin-top: 20px;
  }

  .item {
    min-width: 72px;
    padding: 14px 10px;
    border-radius: 10px;
  }

  .num {
    font-size: 28px;
  }

  .label {
    font-size: 12px;
    margin-top: 6px;
  }
    }

    @media screen and (max-width: 380px) {
  h2 {
    font-size: 22px;
  }

  .panel {
    padding: 14px;
  }

  button {
    padding: 10px 8px;
    font-size: 13px;
  }

  .item {
    min-width: 64px;
    padding: 12px 8px;
  }

  .num {
    font-size: 24px;
  }

  .label {
    font-size: 11px;
  }
    }
    
  </style>
</head>
<body>

  <h2 id="eventTitle">未命名倒计时</h2>

  <div class="panel">
    <div class="row">
      <label for="eventName">事件名称：</label>
      <input
        type="text"
        id="eventName"
        class="name-input"
        maxlength="50"
        placeholder="请输入事件名称"
      />
    </div>

    <div class="row">
      <label for="targetTime">目标时间：</label>
      <input type="datetime-local" id="targetTime" />
    </div>

    <div class="row">
      <button id="startBtn">开始倒计时</button>
      <button id="resetBtn" class="secondary">重置</button>
    </div>

    <div class="row">
      <button id="plus1m" class="secondary">+1分钟</button>
      <button id="plus1h" class="secondary">+1小时</button>
      <button id="plus1d" class="secondary">+1天</button>
    </div>

    <div class="status" id="status">
      请输入事件名称并选择目标时间
    </div>
  </div>

  <div class="countdown state-idle" id="countdown">
    <div class="item">
      <div class="num" id="days">00</div>
      <div class="label">天</div>
    </div>

    <div class="item">
      <div class="num" id="hours">00</div>
      <div class="label">时</div>
    </div>

    <div class="item">
      <div class="num" id="minutes">00</div>
      <div class="label">分</div>
    </div>

    <div class="item">
      <div class="num" id="seconds">00</div>
      <div class="label">秒</div>
    </div>
  </div>

  <script>
    const eventNameInput = document.getElementById("eventName");
    //const saveNameBtn = document.getElementById("saveNameBtn");
    const eventTitle = document.getElementById("eventTitle");

    const targetInput = document.getElementById("targetTime");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusEl = document.getElementById("status");
    const countdownEl = document.getElementById("countdown");

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    const plus1mBtn = document.getElementById("plus1m");
    const plus1hBtn = document.getElementById("plus1h");
    const plus1dBtn = document.getElementById("plus1d");

    let timer = null;
    let endTime = null;
    let started = false;

    const STORAGE_KEY = "customCountdownStateV2";

    function getState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    const savedState = getState();

    let currentEventName = savedState.name || "未命名倒计时";

    function setState(patch = {}) {
      const state = getState();

      const nextState = {
        ...state,
        name: currentEventName,
        targetValue: targetInput.value,
        endTime: endTime,
        started: started,
        ...patch,
        updatedAt: Date.now()
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
    }

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    // 将 Date 对象转换成 datetime-local 需要的格式：YYYY-MM-DDTHH:mm
    function toLocalInputValue(date) {
      const year = date.getFullYear();
      const month = pad(date.getMonth() + 1);
      const day = pad(date.getDate());
      const hours = pad(date.getHours());
      const minutes = pad(date.getMinutes());

      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    // 解析 datetime-local 的本地时间，避免时区歧义
    function parseLocalDateTime(value) {
      if (!value) return NaN;

      const [datePart, timePart = "00:00"] = value.split("T");

      const [year, month, day] = datePart.split("-").map(Number);
      const [hour, minute] = timePart.split(":").map(Number);

      if ([year, month, day, hour, minute].some(item => Number.isNaN(item))) {
        return NaN;
      }

      return new Date(year, month - 1, day, hour, minute, 0, 0).getTime();
    }

    function getTimeParts(ms) {
      const totalSeconds = Math.floor(Math.max(ms, 0) / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return {
        days,
        hours,
        minutes,
        seconds
      };
    }

    function formatParts(parts) {
      return `${parts.days}天 ${parts.hours}小时 ${parts.minutes}分 ${parts.seconds}秒`;
    }

    function setDefaultTarget(forceDefault = false) {
      const now = new Date();
      targetInput.min = toLocalInputValue(now);

      const state = getState();
      const savedValue = forceDefault ? "" : state.targetValue;
      const parsed = parseLocalDateTime(savedValue);

      if (savedValue && !Number.isNaN(parsed) && parsed > Date.now()) {
        targetInput.value = savedValue;
      } else {
        const defaultTarget = new Date(Date.now() + 60 * 60 * 1000);
        targetInput.value = toLocalInputValue(defaultTarget);
      }
    }

    function setDigits(parts) {
      daysEl.textContent = pad(parts.days);
      hoursEl.textContent = pad(parts.hours);
      minutesEl.textContent = pad(parts.minutes);
      secondsEl.textContent = pad(parts.seconds);
    }

    function resetDigits() {
      setDigits({
        days: 0,
        hours: 0,
        minutes: 0,
        seconds: 0
      });
    }

    function clearTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function setContainerState(state) {
      countdownEl.classList.remove("state-idle", "state-running", "state-ended");
      countdownEl.classList.add(`state-${state}`);
    }

    function setControlsDisabled(disabled) {
      startBtn.disabled = disabled;
      targetInput.disabled = disabled;
      plus1mBtn.disabled = disabled;
      plus1hBtn.disabled = disabled;
      plus1dBtn.disabled = disabled;
    }

    function applyEventName(name) {
      currentEventName = name;
      eventTitle.textContent = name;
    }

    function saveEventName() {
      const name = eventNameInput.value.trim();

      if (!name) {
        alert("事件名称不能为空");
        eventNameInput.value = currentEventName;
        return false;
      }

      applyEventName(name);
      setState({ name });

      if (started) {
        updateCountdown();
      } else {
        statusEl.textContent = `${currentEventName} 已准备就绪`;
      }

      return true;
    }

    function updateCountdown() {
      if (!started || endTime === null) {
        setContainerState("idle");
        resetDigits();
        statusEl.textContent = `${currentEventName} 已准备就绪`;
        return;
      }

      const now = Date.now();
      const diff = endTime - now;

      if (diff > 0) {
        // 还没结束：绿色，正常倒计时
        const parts = getTimeParts(diff);
        setDigits(parts);
        setContainerState("running");
        statusEl.textContent = `${currentEventName} 倒计时进行中`;
      } else {
        // 已经结束：红色，继续往后计时
        const parts = getTimeParts(-diff);
        setDigits(parts);
        setContainerState("ended");
        statusEl.textContent = `${currentEventName} 已结束，已过去 ${formatParts(parts)}`;
      }
    }

    function startTimer() {
      clearTimer();
      updateCountdown();
      timer = setInterval(updateCountdown, 1000);
    }

    function startCountdown() {
      if (started) {
        return;
      }

      const name = eventNameInput.value.trim();

      if (!name) {
        alert("请先填写事件名称");
        eventNameInput.focus();
        return;
      }

      applyEventName(name);

      const value = targetInput.value;

      if (!value) {
        alert("请选择目标时间");
        return;
      }

      const targetTime = parseLocalDateTime(value);

      if (Number.isNaN(targetTime)) {
        alert("目标时间格式不正确");
        return;
      }

      /*if (targetTime <= Date.now()) {
        alert("目标时间必须晚于当前时间");
        return;
      }*/

      started = true;
      endTime = targetTime;

      setControlsDisabled(true);

      setState({
        name,
        targetValue: value,
        endTime,
        started: true
      });

      startTimer();
    }

    function resetCountdown() {
      clearTimer();

      started = false;
      endTime = null;

      // 【新增】将当前事件名称重置为默认值
      currentEventName = "未命名倒计时"; 
  
      // 【新增】更新输入框的值
      eventNameInput.value = currentEventName;
  
      // 【新增】更新页面标题
      eventTitle.textContent = currentEventName;

      setControlsDisabled(false);
      setDefaultTarget(true);
      resetDigits();
      setContainerState("idle");

      statusEl.textContent = `${currentEventName} 已重置，请设置目标时间`;

      setState({
        started: false,
        endTime: null,
        targetValue: targetInput.value
      });
    }

    function addToTarget(ms) {
      if (started) {
        return;
      }

      let baseTimestamp = targetInput.value
        ? parseLocalDateTime(targetInput.value)
        : Date.now();

      if (Number.isNaN(baseTimestamp) || baseTimestamp <= Date.now()) {
        baseTimestamp = Date.now();
      }

      const nextDate = new Date(baseTimestamp + ms);
      targetInput.value = toLocalInputValue(nextDate);

      setState({
        targetValue: targetInput.value
      });
    }

    function init() {
      eventNameInput.value = currentEventName;
      applyEventName(currentEventName);

      const state = getState();

      // 如果上次刷新前已经开始倒计时，则恢复运行状态
      if (
        state.started &&
        typeof state.endTime === "number" &&
        !Number.isNaN(state.endTime)
      ) {
        started = true;
        endTime = state.endTime;

        targetInput.value = toLocalInputValue(new Date(endTime));
        targetInput.min = toLocalInputValue(
          new Date(Math.min(Date.now(), endTime))
        );

        setControlsDisabled(true);
        startTimer();
      } else {
        started = false;
        endTime = null;

        setDefaultTarget(false);
        setControlsDisabled(false);
        resetDigits();
        setContainerState("idle");

        statusEl.textContent = `${currentEventName} 已准备就绪`;

        setState({
          started: false,
          endTime: null,
          targetValue: targetInput.value
        });
      }
    }

    // 绑定事件
    /*saveNameBtn.addEventListener("click", saveEventName);

    eventNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        saveEventName();
      }
    });*/

    startBtn.addEventListener("click", startCountdown);
    resetBtn.addEventListener("click", resetCountdown);

    plus1mBtn.addEventListener("click", () => {
      addToTarget(60 * 1000);
    });

    plus1hBtn.addEventListener("click", () => {
      addToTarget(60 * 60 * 1000);
    });

    plus1dBtn.addEventListener("click", () => {
      addToTarget(24 * 60 * 60 * 1000);
    });

    targetInput.addEventListener("input", () => {
      if (!started) {
        setState({
          targetValue: targetInput.value
        });
      }
    });

    targetInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        startCountdown();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && started) {
        updateCountdown();
      }
    });

    init();
  </script>

</body>
</html>
